name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every push to main still finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  cdk:
    uses: ./.github/workflows/cdk.yml

  publish-snapshot:
    needs: [tests, cdk]
    if: github.repository == 'jsoizo/ktor-server-lambda' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/publish-snapshot.yml
    secrets:
      maven-central-username: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      maven-central-password: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
