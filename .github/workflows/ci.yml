name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every push to main still finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # x86_64 Linux hosts can build every non-Apple Kotlin/Native target, linuxArm64 included.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # setup-gradle does not cache the Kotlin/Native toolchain, which lives outside the Gradle user home.
      # Keyed by the Kotlin version alone, since only that changes the toolchain.
      - id: kotlin
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - id: konan
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}
      - name: Test build logic
        run: ./gradlew -p build-logic test
      - id: build
        name: Build, test and lint
        run: >-
          ./gradlew check
          :native-hello:bootstrapZipLinuxX64
          :native-hello:bootstrapZipLinuxArm64
          :jvm-managed:lambdaZip
      # Saved only after a successful build, so a download cut short is never cached; a later test failure
      # still keeps it, because this step runs before the integration tests.
      - if: steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Integration test on the Lambda Runtime Interface Emulator
        run: ./gradlew :integration-test:integrationTest
      # The functions deploy as arm64 by default, so also start that binary, under QEMU; the use cases themselves
      # behave the same on both architectures.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Integration test of the arm64 bootstrap
        run: ./gradlew :integration-test:integrationTest -Prie.arch=arm64 --tests 'NativeFunctionTest.respondsToHttpApiEvent'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Type-check and synthesize the CDK stacks
        working-directory: infra
        run: |
          npm ci
          npx tsc --noEmit
          for variant in native jvm-managed; do npx cdk synth --quiet -c variant="$variant"; done
      # Publishing at the end reuses the outputs the checks above already built and tested.
      # An empty version would skip publishing as silently as a release version does.
      - id: version
        run: |
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          test -n "$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"
      # Releases go through a separate, signed process, so a release version on main is skipped rather than failed.
      # Forks have no credentials, so their main branches skip it too.
      - name: Publish the snapshot to the Central Portal
        if: >-
          github.repository == 'jsoizo/ktor-server-lambda' && github.ref == 'refs/heads/main'
          && endsWith(steps.version.outputs.name, '-SNAPSHOT')
        run: ./gradlew publishToMavenCentral
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      - name: Upload test results and reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/test-results/
            **/build/reports/
