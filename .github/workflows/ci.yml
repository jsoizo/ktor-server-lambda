name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every push to main still finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    # x86_64 Linux hosts can build every non-Apple Kotlin/Native target, linuxArm64 included.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # setup-gradle does not cache the Kotlin/Native toolchain, which lives outside the Gradle user home.
      # Each run saves under its own key and restores the newest by prefix, so a cache saved by a run that
      # stopped halfway through the download is replaced by the next run instead of being reused forever.
      - id: konan
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}-${{ github.run_id }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}-
      - name: Test build logic
        run: ./gradlew -p build-logic test
      - id: build
        name: Build, test and lint
        run: >-
          ./gradlew check
          :native-hello:bootstrapZipLinuxX64
          :native-hello:bootstrapZipLinuxArm64
          :jvm-runtime:installDist
          :jvm-managed:lambdaZip
      - if: always() && steps.build.outcome != 'cancelled' && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v6
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}
      - name: Integration test on the Lambda Runtime Interface Emulator
        run: ./gradlew :integration-test:integrationTest
      # The functions deploy as arm64 by default, so also start that binary, under QEMU.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Integration test of the arm64 bootstrap
        run: ./gradlew :integration-test:integrationTest -Prie.arch=arm64 --tests '*nativeBootstrap*'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Type-check and synthesize the CDK stacks
        working-directory: infra
        run: |
          npm ci
          npx tsc --noEmit
          for variant in native jvm-managed jvm-runtime; do npx cdk synth --quiet -c variant="$variant"; done
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'
