name: CDK

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - id: kotlin
        name: Read Kotlin version
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - name: Restore Kotlin/Native toolchain
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}
      - name: Build Lambda assets
        run: ./gradlew :native-hello:bootstrapZipLinuxArm64 :jvm-managed:lambdaZip
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - name: Install dependencies
        working-directory: infra
        run: npm ci
      - name: Type-check
        working-directory: infra
        run: npm run build
      - name: Synthesize stacks
        working-directory: infra
        run: for variant in native jvm-managed; do npx cdk synth --quiet -c variant="$variant"; done
