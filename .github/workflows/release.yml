name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: maven-central-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'jsoizo/ktor-server-lambda'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Accept stable versions and prereleases such as v0.1.0-rc.1.
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z0-9]+([.-][A-Za-z0-9]+)*)?$ ]] || [[ "$RELEASE_TAG" =~ [Ss][Nn][Aa][Pp][Ss][Hh][Oo][Tt] ]]; then
            echo '::error::Use a release tag such as v0.1.0 or v0.1.0-rc.1; snapshots are not releases.'
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

  tests:
    needs: validate
    uses: ./.github/workflows/tests.yml

  cdk:
    needs: validate
    uses: ./.github/workflows/cdk.yml

  stage:
    needs: [validate, tests, cdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: 21
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - id: kotlin
        name: Read Kotlin version
        run: echo "version=$(sed -n 's/^kotlin = "\(.*\)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - name: Restore Kotlin/Native toolchain
        uses: actions/cache/restore@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ steps.kotlin.outputs.version }}
      - name: Sign and upload to Central Portal
        shell: bash
        run: |
          set -euo pipefail
          for credential in ORG_GRADLE_PROJECT_mavenCentralUsername ORG_GRADLE_PROJECT_mavenCentralPassword ORG_GRADLE_PROJECT_signingInMemoryKey; do
            if [[ -z "${!credential}" ]]; then
              echo "::error::Missing required publishing credential: $credential"
              exit 1
            fi
          done
          ./gradlew publishToMavenCentral \
            -PVERSION_NAME="$RELEASE_VERSION" \
            -PmavenCentralAutomaticPublishing=false \
            --no-configuration-cache --no-daemon
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_IN_MEMORY_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_IN_MEMORY_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_IN_MEMORY_KEY_PASSWORD }}
      - name: Show manual release instructions
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          printf '## Release %s uploaded\n\n' "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          The signed artifacts were uploaded to Central Portal for manual publication.
          CI does not publish them to Maven Central.

          1. Open [Central Portal deployments](https://central.sonatype.com/publishing/deployments).
          2. Find the deployment ID from the upload step's log and confirm its status is `VALIDATED`.
          3. Review the artifacts and click **Publish**.
          4. Wait for `PUBLISHED` before announcing the release.
          EOF
